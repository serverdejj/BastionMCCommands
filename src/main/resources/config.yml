# Los comandos sin * solo permiten la ruta exacta. Con * permiten también argumentos.
# Las reglas deny prevalecen sobre todas las listas de grupos.
# Los grupos se suman al default cuando el jugador tiene bastioncommands.group.<grupo>.
# No se conceden permisos de otros plugins. Configúralos en LuckPerms.
settings:
  op-bypass: true
  refresh-ticks: 40
  block-namespaced: true
  # Si un comando pertenece al servidor mediante un prefijo, normalmente se bloquea.
  # No activar excepciones sin revisar sus permisos originales.
  namespaced-exceptions: []
deny:
  - 'plugins *'
  - 'pl *'
  - 'version *'
  - 'ver *'
  - 'about *'
  - '? *'
  - 'help *'
  - 'op *'
  - 'deop *'
  - 'lp *'
  - 'luckperms *'
  - 'bcmd *'
  - 'ah admin *'
  - 'ah reload *'
  - 'clan admin *'
  - 'clan reload *'
  - 'prote give *'
  - 'prote admin *'
  - 'prote reload *'
  - 'shop admin *'
  - 'shop reload *'
